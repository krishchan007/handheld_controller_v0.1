; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:stm32g070kb]
platform = ststm32
board = nucleo_g071rb ; We use the RB variant as a base template
framework = arduino

; Correct the MCU and upload settings for your specific K-variant (32 pins)
board_build.mcu = stm32g070kbt6
board_build.f_cpu = 64000000L

; Upload & Debugging configuration (assuming you are using an ST-Link V2 or V3)
upload_protocol = stlink
debug_tool = stlink

; Build flags to tell the STM32duino core exactly which chip variant you have
build_flags = 
    -D ARDUINO_GENERIC_G070KBTX
    -D PIN_WIRE_SDA=PA12
    -D PIN_WIRE_SCL=PA11
    -D PIN_SERIAL_TX=PA9
    -D PIN_SERIAL_RX=PA10
